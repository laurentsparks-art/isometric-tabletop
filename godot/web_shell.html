<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODM Isometric Tabletop</title><link rel="icon" href="data:,"><link rel="stylesheet" href="board.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090818}canvas{display:block;width:100%;height:100%;outline:none}#status{position:absolute;inset:40% 10%;color:#ccc;font:14px system-ui;text-align:center;pointer-events:none}</style>$GODOT_HEAD_INCLUDE</head><body><div id="labels"></div><nav aria-label="Map rotation"><button id="left" aria-label="Rotate Left" title="Rotate Left (Q)">&#8630;</button><img id="north" src="north-ne.png" alt="True map north" width="48" height="32"><button id="right" aria-label="Rotate Right" title="Rotate Right (E)">&#8631;</button></nav><canvas id="canvas" tabindex="0"></canvas><div id="status">Loading tabletop...</div><script src="$GODOT_URL"></script><script>const engine=new Engine($GODOT_CONFIG);window.addEventListener('odm-adapter-ready',()=>engine.startGame({canvas:document.getElementById('canvas'),focusCanvas:false}).then(()=>document.getElementById('status').remove()).catch(e=>{document.getElementById('status').textContent='Renderer could not start: '+e.message;console.error(e);parent.postMessage({odm:1,type:'error',message:String(e)},'*');}));</script><script type="module" src="board.mjs"></script></body></html>
