[preset.0]
name="ODM Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,.export-templates/*,assets/generated/*,assets/sources/*,assets/sources/terrain/*,assets/metadata/terrain-sources.json,assets/metadata/previews/*,assets/terrain/*,fixtures/*,assets/metadata/sources.json,assets/metadata/art-recovery.json,assets/metadata/recovery-library.json,assets/metadata/approved-*.json,assets/metadata/north-arrow.json"
export_path="../addon/ui/index.html"

[preset.0.options]
custom_template/debug="res://.export-templates/web_nothreads_debug.zip"
custom_template/release="res://.export-templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web_shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=false
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
